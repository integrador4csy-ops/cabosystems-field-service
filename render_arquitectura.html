<body>
  <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1500" width="2200" height="1500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#000000" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g id="header">
    <text x="1100" y="55" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">CABOSYSTEMS - DIAGRAMA DE ARQUITECTURA DE SOFTWARE</text>
    <text x="1100" y="85" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#000000">Arquitectura Híbrida Multicapa: Clientes Móvil y Web, Protocolos Seguros y Backend Supabase</text>
    <line x1="80" y1="110" x2="2120" y2="110" stroke="#000000" stroke-width="2" />
  </g>

  
    <g class="layer">
      <rect x="100" y="150" width="2000" height="340" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="100" y="150" width="780" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <text x="120" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">1. CAPA DE PRESENTACIÓN / CLIENTES FRONTEND</text>
    </g>
  
    <g class="comp">
      <rect x="140" y="200" width="920" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="140" y="200" width="920" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="600" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Aplicación Móvil de Campo (React Native + Expo)</text>
      <text x="155" y="248" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Framework: Expo SDK 51 con React Native y TypeScript</text>
<text x="155" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Navegación: Expo Router (Stack jerárquico)</text>
<text x="155" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Módulo Check-In/Check-Out: Interfaz táctil con validación de jornada</text>
<text x="155" y="308" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Captura Multimedia: expo-image-picker con compresión optimizada</text>
<text x="155" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Servicio de Telemetría: expo-location en segundo plano (background location task)</text>
<text x="155" y="348" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Soporte Offline: Cache local persistente con AsyncStorage y NetInfo</text>
<text x="155" y="368" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Sistema de Diseño: Paleta corporativa CaboSystems sin emojis (Theme.ts)</text>
    </g>
  
    <g class="comp">
      <rect x="1140" y="200" width="920" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="1140" y="200" width="920" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1600" y="219" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Dashboard Web Administrativo (React + Vite)</text>
      <text x="1155" y="248" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Framework: React 18, Vite y TypeScript de alto rendimiento</text>
<text x="1155" y="268" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Motor Cartográfico: Leaflet con capas Google Maps 2x Retina y Satélite Esri</text>
<text x="1155" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Radar de Flota: Renderizado interactivo de personal en vivo sobre mapa</text>
<text x="1155" y="308" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Cálculo de Permanencia: Geocerca base CaboSystems (desde: HH:MM hrs)</text>
<text x="1155" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Gestión de Personal: Modal corporativo de invitación, roles y expulsión de cuentas</text>
<text x="1155" y="348" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Supervisión de Obras: Tableros kanban de proyectos, tareas y subtareas</text>
<text x="1155" y="368" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Auditoría: Visor de evidencias fotográficas con coordenadas satelitales</text>
    </g>
  
    <g class="arrow-bi">
      <line x1="600" y1="490" x2="600" y2="600" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
      
    <rect x="510" y="535" width="180" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="600" y="549" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">HTTPS / WSS (WebSockets)</text>
  
    </g>
  
    <g class="arrow-bi">
      <line x1="1600" y1="490" x2="1600" y2="600" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
      
    <rect x="1510" y="535" width="180" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="1600" y="549" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">HTTPS REST / Realtime WSS</text>
  
    </g>
  
    <g class="layer">
      <rect x="100" y="600" width="2000" height="170" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="100" y="600" width="780" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <text x="120" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">2. CAPA DE COMUNICACIÓN, PROTOCOLOS Y SEGURIDAD</text>
    </g>
  
    <g class="comp">
      <rect x="140" y="650" width="600" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="140" y="650" width="600" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="440" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Protocolo REST API / HTTPS</text>
      <text x="155" y="698" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Endpoints seguros con TLS 1.3</text>
<text x="155" y="718" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Transmisión de Check-Ins, tareas y firmas</text>
<text x="155" y="738" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Carga multipart/form-data para fotos</text>
    </g>
  
    <g class="comp">
      <rect x="800" y="650" width="600" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="800" y="650" width="600" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1100" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">WebSockets (Supabase Realtime)</text>
      <text x="815" y="698" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Canal 'telemetria': GPS en vivo cada 3-5 s</text>
<text x="815" y="718" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Canal 'chat_mensajes': Mensajería instantánea</text>
<text x="815" y="738" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Broadcast bidireccional de baja latencia</text>
    </g>
  
    <g class="comp">
      <rect x="1460" y="650" width="600" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="1460" y="650" width="600" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1760" y="669" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Control de Acceso y Tokens JWT</text>
      <text x="1475" y="698" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Autenticación stateless basada en Bearer Tokens</text>
<text x="1475" y="718" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Tokens únicos de invitación (32 caracteres)</text>
<text x="1475" y="738" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Expiración configurable de sesiones de trabajo</text>
    </g>
  
    <g class="arrow-bi">
      <line x1="600" y1="770" x2="600" y2="880" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
      
    <rect x="510" y="815" width="180" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="600" y="829" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">PostgreSQL Protocol / RPC</text>
  
    </g>
  
    <g class="arrow-bi">
      <line x1="1600" y1="770" x2="1600" y2="880" stroke="#000000" stroke-width="1.8" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
      
    <rect x="1510" y="815" width="180" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="1600" y="829" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Storage API / Realtime Engine</text>
  
    </g>
  
    <g class="layer">
      <rect x="100" y="880" width="2000" height="540" fill="#ffffff" stroke="#000000" stroke-width="2" />
      <rect x="100" y="880" width="780" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <text x="120" y="902" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#000000">3. CAPA DE BACKEND COMO SERVICIO Y PERSISTENCIA (SUPABASE / POSTGRESQL)</text>
    </g>
  
    <g class="comp">
      <rect x="140" y="930" width="430" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="140" y="930" width="430" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="355" y="949" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Supabase Auth (Seguridad)</text>
      <text x="155" y="978" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Gestor de Identidades de Usuario</text>
<text x="155" y="998" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Autenticación Email / Contraseña</text>
<text x="155" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Invitaciones seguras por correo</text>
<text x="155" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Integración nativa con auth.users</text>
<text x="155" y="1058" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Trigger para perfil automático</text>
    </g>
  
    <g class="comp">
      <rect x="610" y="930" width="980" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="610" y="930" width="980" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1100" y="949" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">PostgreSQL 15 (Base de Datos Relacional - 14 Tablas)</text>
      <text x="625" y="978" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Módulo Operaciones: proyectos, tareas, subtareas, pendientes, registros_campo</text>
<text x="625" y="998" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Módulo Seguridad y Usuarios: profiles, invitaciones</text>
<text x="625" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Módulo Telemetría GPS: ubicaciones_usuarios (en vivo), historial_ubicaciones (trazabilidad)</text>
<text x="625" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Módulo Chat Cuadrillas: chat_grupos, chat_miembros, chat_mensajes, chat_reacciones, chat_stickers</text>
<text x="625" y="1058" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Tipos de datos espaciales y precisión flotante para coordenadas satelitales (lat/long)</text>
    </g>
  
    <g class="comp">
      <rect x="1630" y="930" width="430" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="1630" y="930" width="430" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1845" y="949" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Supabase Storage (Objetos)</text>
      <text x="1645" y="978" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Bucket 'evidencias-campo': Fotos obligatorias de Check-In/Out</text>
<text x="1645" y="998" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Bucket 'avatars': Fotos de perfil</text>
<text x="1645" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Almacenamiento CDN en la nube</text>
<text x="1645" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• URLs públicas y privadas protegidas</text>
    </g>
  
    <g class="comp">
      <rect x="140" y="1170" width="900" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="140" y="1170" width="900" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="590" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Políticas de Seguridad Row Level Security (RLS)</text>
      <text x="155" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Aislamiento por Usuario: Técnicos solo modifican sus propios registros y ubicación</text>
<text x="155" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Permisos de Supervisor: Consulta global de cuadrillas, auditoría y mapa de flota</text>
<text x="155" y="1258" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Permisos de Administrador: Control total sobre proyectos, roles y baja de usuarios</text>
<text x="155" y="1278" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Protección en Motor DB: Políticas evaluadas directamente por el kernel de PostgreSQL</text>
    </g>
  
    <g class="comp">
      <rect x="1100" y="1170" width="960" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="1100" y="1170" width="960" height="28" fill="#f8fafc" stroke="#000000" stroke-width="1" />
      <text x="1580" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Procedimientos Almacenados, Triggers y Edge Services</text>
      <text x="1115" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Trigger handle_new_user: Creación automática de fila en 'profiles' al registrarse</text>
<text x="1115" y="1238" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Trigger update_timestamp: Actualización automática de 'updated_at' en telemetría</text>
<text x="1115" y="1258" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Servicio SMTP: Envío de invitaciones de registro por correo electrónico con token seguro</text>
<text x="1115" y="1278" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000000">• Geofencing Engine: Función de verificación de radio de geocerca en Base CaboSystems</text>
    </g>
</svg>
