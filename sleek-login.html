<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #000000;
        --foreground: #ffffff;
        --primary: #f78c26;
        --primary-foreground: #ffffff;
        --secondary: #343e48;
        --secondary-foreground: #ffffff;
        --muted: #343e48;
        --muted-foreground: #ffffff;
        --accent: #f78c26;
        --accent-foreground: #ffffff;
        --destructive: #f78c26;
        --card: #343e48;
        --card-foreground: #ffffff;
        --popover: #000000;
        --popover-foreground: #ffffff;
        --border: #343e48;
        --input: #000000;
        --ring: #f78c26;
        --chart-1: #f78c26;
        --chart-2: #ffffff;
        --chart-3: #343e48;
        --chart-4: #000000;
        --chart-5: #f78c26;

        --font-sans: "Montserrat";
        --font-heading: "Montserrat";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.75rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main
      style="font-family: var(--font-sans)"
      class="min-h-screen bg-background text-foreground flex flex-col px-7 py-10"
    >
      <div class="flex-1 flex flex-col">
        <div class="flex justify-center pt-8 mb-16">
          <div class="flex flex-col items-center gap-3">
            <div
              class="size-14 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20"
            >
              <iconify-icon
                icon="solar:home-2-bold"
                class="text-primary-foreground"
                width="28"
                height="28"
              ></iconify-icon>
            </div>
            <div class="text-center">
              <div class="font-heading text-xl font-bold tracking-[0.18em] text-foreground">
                CABO<span class="text-primary">SYSTEMS</span>
              </div>
              <div class="mt-1 text-[10px] tracking-[0.28em] text-muted-foreground uppercase">
                Field Service
              </div>
            </div>
          </div>
        </div>
        <section class="max-w-md w-full mx-auto">
          <div class="mb-9">
            <h1 class="font-heading text-3xl font-semibold tracking-tight">Welcome back</h1>
            <p class="mt-2 text-sm leading-6 text-muted-foreground">
              Sign in to manage your field visits and client projects.
            </p>
          </div>
          <form class="space-y-5">
            <div>
              <label
                for="email"
                class="mb-2 block text-xs font-semibold uppercase tracking-[0.12em] text-muted-foreground"
                >Work email</label
              >
              <div class="relative">
                <iconify-icon
                  icon="solar:letter-linear"
                  class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"
                  width="20"
                  height="20"
                ></iconify-icon
                ><input
                  id="email"
                  type="email"
                  class="h-14 w-full rounded-xl border border-border bg-input pl-12 pr-4 text-sm text-foreground outline-none placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-ring/30"
                  placeholder="you@cabosystems.com"
                />
              </div>
            </div>
            <div>
              <div class="mb-2 flex items-center justify-between">
                <label
                  for="password"
                  class="block text-xs font-semibold uppercase tracking-[0.12em] text-muted-foreground"
                  >Password</label
                ><a href="#" class="text-xs font-semibold text-primary">Forgot password?</a>
              </div>
              <div class="relative">
                <iconify-icon
                  icon="solar:lock-keyhole-linear"
                  class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"
                  width="20"
                  height="20"
                ></iconify-icon
                ><input
                  id="password"
                  type="password"
                  class="h-14 w-full rounded-xl border border-border bg-input pl-12 pr-12 text-sm text-foreground outline-none placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-ring/30"
                  placeholder="Enter your password"
                /><button
                  type="button"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-muted-foreground"
                  aria-label="Show password"
                >
                  <iconify-icon icon="solar:eye-linear" width="20" height="20"></iconify-icon>
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="mt-3 flex h-14 w-full items-center justify-center gap-2 rounded-xl bg-primary font-heading text-sm font-bold tracking-wide text-primary-foreground shadow-lg shadow-primary/20 transition-opacity active:opacity-80"
            >
              Sign in<iconify-icon
                icon="solar:arrow-right-linear"
                width="20"
                height="20"
              ></iconify-icon>
            </button>
          </form>
        </section>
      </div>
      <footer
        class="mx-auto mt-12 flex items-center gap-2 text-center text-[11px] text-muted-foreground"
      >
        <iconify-icon
          icon="solar:shield-check-linear"
          class="text-primary"
          width="16"
          height="16"
        ></iconify-icon
        ><span>Secure access for CaboSystems technicians</span>
      </footer>
    </main>
  </body>
</html>
