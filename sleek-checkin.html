<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CheckIn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #000000;
        --foreground: #ffffff;
        --primary: #f78c26;
        --primary-foreground: #ffffff;
        --secondary: #343e48;
        --secondary-foreground: #ffffff;
        --muted: #343e48;
        --muted-foreground: #ffffff;
        --accent: #f78c26;
        --accent-foreground: #ffffff;
        --destructive: #f78c26;
        --card: #343e48;
        --card-foreground: #ffffff;
        --popover: #000000;
        --popover-foreground: #ffffff;
        --border: #343e48;
        --input: #000000;
        --ring: #f78c26;
        --chart-1: #f78c26;
        --chart-2: #ffffff;
        --chart-3: #343e48;
        --chart-4: #000000;
        --chart-5: #f78c26;

        --font-sans: "Montserrat";
        --font-heading: "Montserrat";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.75rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <main
      style="font-family: var(--font-sans)"
      class="relative min-h-screen bg-background text-foreground flex flex-col justify-between"
    >
      <header
        class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between bg-gradient-to-b from-black/80 to-transparent p-5"
      >
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full bg-black/40 text-foreground backdrop-blur border border-white/20"
          aria-label="Cancel check in"
        >
          <iconify-icon icon="solar:close-circle-linear" width="24" height="24"></iconify-icon>
        </button>
        <div
          class="rounded-full bg-black/50 px-3.5 py-1.5 backdrop-blur border border-white/10 flex items-center gap-2"
        >
          <span class="size-2 rounded-full bg-primary animate-ping"></span
          ><span class="text-xs font-semibold tracking-wide uppercase">Site Check-In</span>
        </div>
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-full bg-black/40 text-foreground backdrop-blur border border-white/20"
          aria-label="Toggle Flash"
        >
          <iconify-icon
            icon="solar:bolt-linear"
            class="text-primary"
            width="20"
            height="20"
          ></iconify-icon>
        </button>
      </header>
      <div
        class="relative flex-1 min-h-[52vh] bg-black overflow-hidden flex items-center justify-center"
      >
        <img
          alt="Camera live view of client equipment rack"
          src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/IMizAOZdqWe/components/xCbOaQLuaAn.jpeg"
          class="h-full w-full object-cover"
        />
        <div
          class="pointer-events-none absolute inset-8 border border-white/25 rounded-2xl flex flex-col justify-between p-4"
        >
          <div class="flex justify-between">
            <div class="size-4 border-t-2 border-l-2 border-primary"></div>
            <div class="size-4 border-t-2 border-r-2 border-primary"></div>
          </div>
          <div
            class="self-center flex items-center gap-1.5 bg-black/60 px-3 py-1 rounded-full text-[11px] font-mono text-white/90 backdrop-blur"
          >
            <iconify-icon
              icon="solar:camera-minimalistic-linear"
              class="text-primary"
              width="14"
              height="14"
            ></iconify-icon
            ><span>Align rack or serial tag</span>
          </div>
          <div class="flex justify-between">
            <div class="size-4 border-b-2 border-l-2 border-primary"></div>
            <div class="size-4 border-b-2 border-r-2 border-primary"></div>
          </div>
        </div>
        <div class="absolute bottom-4 left-0 right-0 flex justify-center">
          <button
            type="button"
            class="flex size-16 items-center justify-center rounded-full border-4 border-primary bg-white/20 backdrop-blur p-1"
            aria-label="Capture Photo"
          >
            <div class="size-12 rounded-full bg-primary flex items-center justify-center">
              <iconify-icon
                icon="solar:camera-bold"
                class="text-primary-foreground"
                width="24"
                height="24"
              ></iconify-icon>
            </div>
          </button>
        </div>
      </div>
      <section
        class="z-20 -mt-3 rounded-t-3xl border-t border-border/80 bg-background p-5 shadow-2xl"
      >
        <div
          class="mb-4 flex items-center justify-between rounded-xl border border-border/70 bg-secondary/60 px-4 py-3"
        >
          <div class="flex items-center gap-3">
            <div
              class="flex size-9 items-center justify-center rounded-lg bg-primary/15 text-primary"
            >
              <iconify-icon icon="solar:map-point-wave-bold" width="20" height="20"></iconify-icon>
            </div>
            <div>
              <span
                class="block text-[10px] uppercase font-bold tracking-wider text-muted-foreground"
                >GPS Location Verified</span
              ><span class="font-mono text-xs font-semibold text-foreground"
                >22.8905Â° N, 109.9167Â° W (Â±3m)</span
              >
            </div>
          </div>
          <span class="inline-flex items-center gap-1 text-[11px] font-bold text-primary"
            ><iconify-icon icon="solar:check-circle-bold" width="16" height="16"></iconify-icon
            >Matched</span
          >
        </div>
        <div class="mb-4">
          <label
            for="checkin-notes"
            class="mb-1.5 block text-xs font-semibold uppercase tracking-[0.1em] text-muted-foreground"
            >Technician Notes &amp; Arrival Comments</label
          ><textarea
            id="checkin-notes"
            rows="2"
            class="w-full rounded-xl border border-border bg-input p-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-primary focus:ring-2 focus:ring-ring/30 outline-none resize-none"
            placeholder="e.g. Arrived on site, gate code valid, starting main rack power cycle..."
          ></textarea>
        </div>
        <button
          type="button"
          class="flex h-14 w-full items-center justify-center gap-2 rounded-xl bg-primary font-heading text-base font-bold tracking-wide text-primary-foreground shadow-lg shadow-primary/25 active:opacity-90"
        >
          <iconify-icon icon="solar:check-read-linear" width="20" height="20"></iconify-icon>Submit
          Check-In
        </button>
      </section>
    </main>
  </body>
</html>
