name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Título del Release (Opcional)'
        required: false
        default: 'CaboSystems Mobile v1.0.0'
      create_release:
        description: '¿Publicar como GitHub Release? (true / false)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: 🔨 Compilar APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cabosystems-mobile/package-lock.json

      - name: 📥 Instalar dependencias
        working-directory: ./cabosystems-mobile
        run: npm ci

      - name: 🔐 Configurar Variables de Entorno
        working-directory: ./cabosystems-mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: ⚙️ Prebuild de Expo (Generar proyecto Android nativo)
        working-directory: ./cabosystems-mobile
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compilar APK con Gradle
        working-directory: ./cabosystems-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Renombrar APK generado
        run: |
          mkdir -p build-output
          cp cabosystems-mobile/android/app/build/outputs/apk/release/app-release.apk build-output/cabosystems-field-service.apk

      - name: 📤 Guardar APK como Artifact en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cabosystems-field-service-apk
          path: build-output/cabosystems-field-service.apk
          retention-days: 30

      - name: 🏷️ Publicar APK en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/cabosystems-field-service.apk
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
