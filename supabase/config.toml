project_id = "cabosystems-field-service"

[functions.invite-colaborador]
# El enlace del correo y el alta por token son públicos; la función valida
# internamente las operaciones administrativas con la sesión del responsable.
verify_jwt = false

[functions.google-calendar]
verify_jwt = true

[functions.google-calendar-events]
verify_jwt = true

[functions.google-calendar-callback]
# Google redirects without a Supabase Authorization header. The handler
# validates expiring single-use OAuth state, PKCE and a canonical active admin.
verify_jwt = false
